<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViquinhoChat</title>

    <!-- ============================================================
    FONTS & ICONS
    ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- ============================================================
    STYLES
    ============================================================ -->
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff7a00;
            --primary-hover: #e06e00;
            --primary-glow: rgba(255, 122, 0, 0.25);
            --bg-primary: #0f0f10;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --bg-hover: #2a2a2e;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #6b6b77;
            --border-color: #2a2a2e;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-full: 9999px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a40;
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a50;
        }

        /* ----- UTILITY ----- */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        /* ----- GLASS CARD ----- */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* ----- BUTTONS ----- */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
            font-family: var(--font);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
            font-family: var(--font);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: #3a3a40;
        }

        .btn-danger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            color: #ef4444;
            font-weight: 500;
            font-size: 0.85rem;
            border: 1px solid #ef444433;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
            font-family: var(--font);
        }
        .btn-danger:hover {
            background: #ef444422;
            border-color: #ef444466;
        }

        /* ----- INPUTS ----- */
        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: var(--font);
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .input-field::placeholder {
            color: var(--text-muted);
        }

        /* ----- APP LAYOUT ----- */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ============================================================
        PAGE: LOGIN
        ============================================================ */
        .page-login {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        .page-login::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 122, 0, 0.06), transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(255, 122, 0, 0.04), transparent 50%);
            pointer-events: none;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            text-align: center;
        }

        .login-card .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .login-card .logo-icon {
            font-size: 2.4rem;
            color: var(--primary);
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary), #ff9a44);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 8px;
            margin-bottom: 32px;
            line-height: 1.5;
            -webkit-text-fill-color: var(--text-secondary);
        }

        .login-card .password-reveal {
            margin-top: 24px;
            animation: fadeIn 0.6s ease forwards;
        }

        .login-card .password-reveal .input-field {
            text-align: center;
            letter-spacing: 2px;
            font-size: 1.1rem;
        }

        .login-card .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 24px;
            font-weight: 500;
        }

        /* ============================================================
        PAGE: USER SELECT
        ============================================================ */
        .page-select {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--bg-primary);
        }

        .select-card {
            width: 100%;
            max-width: 600px;
            padding: 40px 32px;
        }

        .select-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .select-card .select-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .user-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            background: var(--bg-input);
            border: 2px solid transparent;
            border-radius: var(--radius);
            cursor: pointer;
            transition: border-color var(--transition), background var(--transition), transform var(--transition);
        }
        .user-card:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .user-card.active {
            border-color: var(--primary);
            background: var(--bg-hover);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .user-card .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary);
            border: 2px solid var(--border-color);
            margin-bottom: 10px;
            transition: border-color var(--transition);
        }
        .user-card:hover .avatar,
        .user-card.active .avatar {
            border-color: var(--primary);
        }

        .user-card .user-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .user-card .user-role {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .user-card .user-badge {
            margin-top: 8px;
            font-size: 0.65rem;
            padding: 2px 12px;
            border-radius: var(--radius-full);
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .user-password-overlay {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.3s ease forwards;
        }

        .user-password-overlay .input-group {
            display: flex;
            gap: 10px;
        }
        .user-password-overlay .input-group .input-field {
            flex: 1;
        }

        /* ============================================================
        CHAT LAYOUT
        ============================================================ */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-primary);
        }

        /* ----- TOP BAR ----- */
        .chat-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chat-topbar .left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .chat-topbar .left .logo-small {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            white-space: nowrap;
        }
        .chat-topbar .left .logo-small i {
            font-size: 1.2rem;
        }

        .chat-topbar .left .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 14px;
            border-left: 1px solid var(--border-color);
        }

        .chat-topbar .left .user-info .mini-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
            border: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-topbar .left .user-info .name-role {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .chat-topbar .left .user-info .name-role .name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .chat-topbar .left .user-info .name-role .role {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .chat-topbar .left .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .chat-topbar .left .status-dot.online {
            background: #22c55e;
        }
        .chat-topbar .left .status-dot.offline {
            background: var(--text-muted);
        }

        .chat-topbar .right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .chat-topbar .right .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-topbar .right .icon-btn:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .chat-topbar .right .icon-btn.active {
            color: var(--primary);
        }

        /* ----- MAIN CHAT AREA (sidebar + messages) ----- */
        .chat-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .chat-sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .chat-sidebar.collapsed {
            width: 0;
            border-right: none;
        }

        .chat-sidebar .sidebar-header {
            padding: 16px 18px 10px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-sidebar .sidebar-header h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .chat-sidebar .sidebar-users {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidebar-user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            cursor: pointer;
            transition: background var(--transition);
            border-radius: 0;
        }
        .sidebar-user-item:hover {
            background: var(--bg-hover);
        }

        .sidebar-user-item .s-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--primary);
            border: 2px solid var(--border-color);
            flex-shrink: 0;
            position: relative;
        }

        .sidebar-user-item .s-avatar .s-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
        }
        .sidebar-user-item .s-avatar .s-dot.online {
            background: #22c55e;
        }
        .sidebar-user-item .s-avatar .s-dot.offline {
            background: var(--text-muted);
        }

        .sidebar-user-item .s-info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-user-item .s-info .s-name {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .sidebar-user-item .s-info .s-status {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .sidebar-user-item .s-role-badge {
            font-size: 0.55rem;
            padding: 1px 10px;
            border-radius: var(--radius-full);
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        /* --- MESSAGES AREA --- */
        .chat-messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
            min-width: 0;
        }

        .messages-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* message bubble */
        .msg-bubble {
            display: flex;
            gap: 12px;
            padding: 6px 0;
            animation: fadeIn 0.2s ease forwards;
            max-width: 85%;
            align-self: flex-start;
        }

        .msg-bubble.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-bubble .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--primary);
            border: 2px solid var(--border-color);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg-bubble .msg-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .msg-bubble .msg-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .msg-bubble .msg-meta .msg-author {
            font-weight: 600;
            color: var(--text-primary);
        }
        .msg-bubble .msg-meta .msg-author.admin {
            color: var(--primary);
        }
        .msg-bubble .msg-meta .msg-time {
            font-size: 0.65rem;
        }

        .msg-bubble .msg-body {
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border-top-left-radius: 2px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .msg-bubble.own .msg-body {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            border-top-right-radius: 2px;
            border-top-left-radius: var(--radius-sm);
        }

        .msg-bubble .msg-body .msg-text {
            white-space: pre-wrap;
        }

        .msg-bubble .msg-body .msg-image {
            max-width: 280px;
            max-height: 240px;
            border-radius: var(--radius-sm);
            margin-top: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            object-fit: cover;
            width: auto;
            height: auto;
        }
        .msg-bubble.own .msg-body .msg-image {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .msg-bubble .msg-body .msg-file {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            margin-top: 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: background var(--transition);
        }
        .msg-bubble.own .msg-body .msg-file {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .msg-bubble .msg-body .msg-file:hover {
            background: var(--bg-hover);
        }
        .msg-bubble.own .msg-body .msg-file:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .msg-bubble .msg-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .msg-bubble:hover .msg-actions {
            opacity: 1;
        }

        .msg-bubble .msg-actions .act-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }
        .msg-bubble .msg-actions .act-btn:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .msg-bubble .msg-actions .act-btn.danger:hover {
            color: #ef4444;
        }

        .msg-bubble .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .msg-bubble .msg-reactions .reaction {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 8px 1px 6px;
            border-radius: var(--radius-full);
            background: var(--bg-input);
            font-size: 0.75rem;
            cursor: pointer;
            transition: background var(--transition);
            border: 1px solid transparent;
        }
        .msg-bubble .msg-reactions .reaction:hover {
            background: var(--bg-hover);
            border-color: var(--border-color);
        }
        .msg-bubble .msg-reactions .reaction .r-count {
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        /* typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            animation: fadeIn 0.3s ease forwards;
        }
        .typing-indicator .dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            margin: 0 2px;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        .typing-indicator .dots span:nth-child(2) {

    <div id="root"></div>

    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>

    <!-- ============================================================
    APPLICATION
    ============================================================ -->
    <script>
        // ================================================================
        // 1. FIREBASE CONFIG (fornecido pelo usuário)
        // ================================================================

        const firebaseConfig = {
            apiKey: "AIzaSyDQomLAv3wsK5EO6R17h9h1jcm0SPFAU14",
            authDomain: "viquinhochat-94497.firebaseapp.com",
            projectId: "viquinhochat-94497",
            storageBucket: "viquinhochat-94497.firebasestorage.app",
            messagingSenderId: "814527610436",
            appId: "1:814527610436:web:e803ddc22741867d6c8611"
        };

        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        const rtdb = firebase.database();

        // ================================================================
        // 2. USERS DATA (embedded JSON)
        // ================================================================

        const USERS_DATA = {
            users: [{
                id: "luquinha",
                nome: "Luquinha",
                cargo: "Membro",
                senha: "luq66",
                avatar: "L"
            }, {
                id: "francisquinho",
                nome: "Francisquinho",
                cargo: "Membro",
                senha: "chico7234",
                avatar: "F"
            }, {
                id: "viquinho",
                nome: "Viquinho",
                cargo: "Administrador",
                senha: "aura9860",
                avatar: "V"
            }]
        };

        // ================================================================
        // 3. STATE
        // ================================================================

        const STATE = {
            currentUser: null, // { id, nome, cargo, senha, avatar }
            currentUserFirebase: null, // firebase auth user
            selectedUserId: null,
            messages: [],
            onlineUsers: {},
            typingUsers: {},
            isDark: true,
            soundEnabled: true,
            notificationsEnabled: true,
            sidebarOpen: window.innerWidth > 768,
            isAdmin: false,
        };

        // ================================================================
        // 4. DOM REFS (will be set after render)
        // ================================================================

        let $ = (sel) => document.querySelector(sel);
        let $$ = (sel) => document.querySelectorAll(sel);

        // ================================================================
        // 5. RENDER ENGINE (vanilla JS SPA)
        // ================================================================

        const root = document.getElementById('root');

        function render(page, data) {
            switch (page) {
                case 'login':
                    renderLogin();
                    break;
                case 'select':
                    renderSelect();
                    break;
                case 'chat':
                    renderChat();
                    break;
                default:
                    renderLogin();
            }
        }

        // ----- 5a. LOGIN PAGE -----
        function renderLogin() {
            root.innerHTML = `
            <div class="page-login">
              <div class="login-card glass-card">
                <div class="logo">
                  <i class="fas fa-comment-dots logo-icon"></i>
                  <h1>ViquinhoChat</h1>
                </div>
                <p class="subtitle">
                  Um espaço privado para conversar com seus amigos<br />
                  com rapidez, simplicidade e segurança.
                </p>
                <div class="password-reveal fade-in" id="passwordReveal">
                  <input type="password" class="input-field" id="loginPassword" placeholder="Senha do sistema" autocomplete="off" />
                  <button class="btn-primary" id="loginVerifyBtn" style="margin-top:14px;width:100%;">
                    <i class="fas fa-arrow-right"></i> Verificar
                  </button>
                  <div class="error-msg" id="loginError"></div>
                </div>
              </div>
            </div>
          `;

            const input = $('#loginPassword');
            const btn = $('#loginVerifyBtn');
            const err = $('#loginError');

            function verify() {
                const val = input.value.trim();
                if (val === 'toletão') {
                    err.textContent = '';
                    render('select');
                } else {
                    err.textContent = '❌ Senha incorreta. Tente novamente.';
                    input.value = '';
                    input.focus();
                }
            }

            btn.addEventListener('click', verify);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') verify(); });
            setTimeout(() => input.focus(), 100);
        }

        // ----- 5b. USER SELECT PAGE -----
        function renderSelect() {
            root.innerHTML = `
            <div class="page-select">
              <div class="select-card glass-card">
                <h2>👋 Quem é você?</h2>
                <p class="select-sub">Selecione seu perfil para entrar no chat</p>
                <div class="user-grid" id="userGrid"></div>
                <div class="user-password-overlay" id="userPasswordOverlay" style="display:none;">
                  <p style="font-weight:500;font-size:0.95rem;" id="selectedUserName">—</p>
                  <div class="input-group">
                    <input type="password" class="input-field" id="userPasswordInput" placeholder="Sua senha" autocomplete="off" />
                    <button class="btn-primary" id="userLoginBtn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                  </div>
                  <div class="error-msg" id="userLoginError"></div>
                </div>
              </div>
            </div>
          `;

            const grid = $('#userGrid');
            const overlay = $('#userPasswordOverlay');
            const nameDisplay = $('#selectedUserName');
            const passInput = $('#userPasswordInput');
            const loginBtn = $('#userLoginBtn');
            const errorEl = $('#userLoginError');

            let selectedUser = null;

            // Render user cards
            USERS_DATA.users.forEach(u => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.dataset.id = u.id;
                card.innerHTML = `
              <div class="avatar">${u.avatar || u.nome.charAt(0)}</div>
              <div class="user-name">${u.nome}</div>
              <div class="user-role">${u.cargo}</div>
              ${u.cargo === 'Administrador' ? '<div class="user-badge">Admin</div>' : ''}
            `;
                card.addEventListener('click', () => {
                    document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    selectedUser = u;
                    nameDisplay.textContent = `🔐 ${u.nome} — digite sua senha`;
                    overlay.style.display = 'flex';
                    passInput.value = '';
                    errorEl.textContent = '';
                    passInput.focus();
                });
                grid.appendChild(card);
            });

            function attemptLogin() {
                if (!selectedUser) return;
                const pass = passInput.value.trim();
                if (pass === selectedUser.senha) {
                    // Autentica no Firebase (anônimo + uid = user.id)
                    auth.signInAnonymously()
                        .then((cred) => {
                            // Atualiza o perfil com o nome do usuário
                            return cred.user.updateProfile({ displayName: selectedUser.nome });
                        })
                        .then(() => {
                            STATE.currentUser = selectedUser;
                            STATE.isAdmin = selectedUser.cargo === 'Administrador';
                            // Salva no Firestore a presença
                            const userRef = db.collection('users').doc(selectedUser.id);
                            userRef.set({
                                nome: selectedUser.nome,
                                cargo: selectedUser.cargo,
                                avatar: selectedUser.avatar || selectedUser.nome.charAt(0),
                                online: true,
                                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true });

                            // Presença no Realtime Database
                            rtdb.ref(`presence/${selectedUser.id}`).set({
                                online: true,
                                nome: selectedUser.nome,
                                lastSeen: Date.now()
                            });

                            // Quando desconectar, marcar offline
                            rtdb.ref(`presence/${selectedUser.id}`).onDisconnect().set({
                                online: false,
                                nome: selectedUser.nome,
                                lastSeen: Date.now()
                            });

                            render('chat');
                        })
                        .catch((err) => {
                            console.error('Firebase auth error:', err);
                            errorEl.textContent = '❌ Erro ao autenticar. Tente novamente.';
                        });
                } else {
                    errorEl.textContent = '❌ Senha incorreta.';
                    passInput.value = '';
                    passInput.focus();
                }
            }

            loginBtn.addEventListener('click', attemptLogin);
            passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
        }

        // ----- 5c. CHAT PAGE -----
        function renderChat() {
            const user = STATE.currentUser;
            if (!user) { render('login'); return; }

            root.innerHTML = `
            <div class="chat-container">
              <!-- Top Bar -->
              <header class="chat-topbar">
                <div class="left">
                  <div class="logo-small">
                    <i class="fas fa-comment-dots"></i>
                    <span>ViquinhoChat</span>
                  </div>
                  <div class="user-info">
                    <div class="mini-avatar">${user.avatar || user.nome.charAt(0)}</div>
                    <div class="name-role">
                      <span class="name">${user.nome}</span>
                      <span class="role">${user.cargo}</span>
                    </div>
                    <span class="status-dot online" id="statusDot"></span>
                  </div>
                </div>
                <div class="right">
                  <button class="icon-btn" id="toggleSidebarBtn" title="Alternar usuários">
                    <i class="fas fa-users"></i>
                  </button>
                  <button class="icon-btn" id="searchBtn" title="Pesquisar mensagens">
                    <i class="fas fa-search"></i>
                  </button>
                  ${STATE.isAdmin ? `<button class="icon-btn active" id="adminBtn" title="Painel Admin"><i class="fas fa-crown"></i></button>` : ''}
                  <button class="icon-btn" id="settingsBtn" title="Configurações">
                    <i class="fas fa-cog"></i>
                  </button>
                  <button class="icon-btn" id="logoutBtn" title="Sair">
                    <i class="fas fa-sign-out-alt"></i>
                  </button>
                </div>
              </header>

              <!-- Main -->
              <div class="chat-main">
                <!-- Sidebar -->
                <aside class="chat-sidebar ${STATE.sidebarOpen ? '' : 'collapsed'}" id="chatSidebar">
                  <div class="sidebar-header">
                    <h3><i class="fas fa-circle" style="color:#22c55e;font-size:0.5rem;vertical-align:middle;"></i> Online</h3>
                  </div>
                  <div class="sidebar-users" id="sidebarUsers"></div>
                </aside>

                <!-- Messages -->
                <section class="chat-messages">
                  <div class="messages-scroll" id="messagesScroll">
                    <!-- messages rendered here -->
                    <div id="typingIndicator" class="typing-indicator" style="display:none;">
                      <span>Alguém está digitando</span>
                      <span class="dots"><span></span><span></span><span></span></span>
                    </div>
                  </div>

                  <!-- Input -->
                  <div class="chat-input-area" style="position:relative;">
                    <div class="emoji-picker" id="emojiPicker"></div>
                    <div class="input-wrapper">
                      <button class="input-tool" id="emojiBtn" title="Emojis"><i class="far fa-smile"></i></button>

            // ----- CHAT LOGIC -----
            const messagesScroll = $('#messagesScroll');
            const msgInput = $('#msgInput');
            const sendBtn = $('#sendBtn');
            const sidebarUsers = $('#sidebarUsers');
            const typingEl = $('#typingIndicator');
            const emojiPicker = $('#emojiPicker');
            const emojiBtn = $('#emojiBtn');
            const imageBtn = $('#imageBtn');
            const fileBtn = $('#fileBtn');
            const imageInput = $('#imageInput');
            const fileInput = $('#fileInput');
            const toggleSidebarBtn = $('#toggleSidebarBtn');
            const sidebar = $('#chatSidebar');
            const logoutBtn = $('#logoutBtn');
            const settingsBtn = $('#settingsBtn');
            const settingsOverlay = $('#settingsOverlay');
            const settingsClose = $('#settingsClose');
            const settingsCloseBtn = $('#settingsCloseBtn');
            const themeToggle = $('#themeToggle');
            const soundToggle = $('#soundToggle');
            const notifToggle = $('#notifToggle');
            const adminBtn = $('#adminBtn');
            const adminOverlay = $('#adminOverlay');
            const adminClose = $('#adminClose');
            const adminUserList = $('#adminUserList');
            const adminRefreshBtn = $('#adminRefreshBtn');
            const logMsgCount = $('#logMsgCount');
            const searchBtn = $('#searchBtn');

            let allMessages = [];
            let messageListeners = [];
            let presenceListeners = [];
            let typingTimeout = null;
            let isTyping = false;

            // ----- LOAD MESSAGES (Firestore) -----
            function loadMessages() {
                // Limpa listeners antigos
                messageListeners.forEach(unsub => unsub());
                messageListeners = [];

                const query = db.collection('messages')
                    .orderBy('timestamp', 'asc')
                    .limit(200);

                const unsub = query.onSnapshot((snapshot) => {
                    const msgs = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        msgs.push({
                            id: doc.id,
                            ...data,
                            timestamp: data.timestamp?.toDate?.() || new Date(data.timestamp)
                        });
                    });
                    allMessages = msgs;
                    renderMessages(msgs);
                    scrollToBottom();
                    updateLogCount(msgs.length);
                }, (err) => {
                    console.error('Erro ao carregar mensagens:', err);
                });
                messageListeners.push(unsub);
            }

            // ----- RENDER MESSAGES -----
            function renderMessages(msgs) {
                const container = messagesScroll;
                // Remove mensagens antigas (mantém o typing indicator)
                const typingEl = $('#typingIndicator');
                container.querySelectorAll('.msg-bubble').forEach(el => el.remove());

                msgs.forEach(msg => {
                    const bubble = createMessageBubble(msg);
                    container.appendChild(bubble);
                });

                // Re-add typing indicator if visible
                if (typingEl && typingEl.style.display !== 'none') {
                    container.appendChild(typingEl);
                }
            }

            function createMessageBubble(msg) {
                const isOwn = msg.userId === STATE.currentUser.id;
                const wrapper = document.createElement('div');
                wrapper.className = `msg-bubble ${isOwn ? 'own' : ''}`;
                wrapper.dataset.msgId = msg.id;

                const avatar = document.createElement('div');
                avatar.className = 'msg-avatar';
                avatar.textContent = msg.userAvatar || msg.userName?.charAt(0) || '?';

                const content = document.createElement('div');
                content.className = 'msg-content';

                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                const authorSpan = document.createElement('span');
                authorSpan.className = `msg-author ${msg.userCargo === 'Administrador' ? 'admin' : ''}`;
                authorSpan.textContent = msg.userName || 'Desconhecido';
                const timeSpan = document.createElement('span');
                timeSpan.className = 'msg-time';
                timeSpan.textContent = formatTime(msg.timestamp);

                meta.appendChild(authorSpan);
                meta.appendChild(timeSpan);

                // Role badge
                if (msg.userCargo) {
                    const badge = document.createElement('span');
                    badge.style.cssText =
                        'font-size:0.55rem;padding:1px 8px;border-radius:9999px;background:var(--primary);color:#fff;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;';
                    badge.textContent = msg.userCargo === 'Administrador' ? 'Admin' : 'Membro';
                    meta.appendChild(badge);
                }

                const body = document.createElement('div');
                body.className = 'msg-body';

                // Text
                if (msg.text) {
                    const textEl = document.createElement('div');
                    textEl.className = 'msg-text';
                    textEl.textContent = msg.text;
                    body.appendChild(textEl);
                }

                // Image
                if (msg.imageUrl) {
                    const img = document.createElement('img');
                    img.className = 'msg-image';
                    img.src = msg.imageUrl;
                    img.alt = 'Imagem';
                    img.loading = 'lazy';
                    img.addEventListener('click', () => window.open(msg.imageUrl, '_blank'));
                    body.appendChild(img);
                }

                // File
                if (msg.fileUrl && msg.fileName) {
                    const a = document.createElement('a');
                    a.className = 'msg-file';
                    a.href = msg.fileUrl;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.innerHTML = `<i class="fas fa-file"></i> ${msg.fileName}`;
                    body.appendChild(a);
                }

                // Reactions
                if (msg.reactions && Object.keys(msg.reactions).length > 0) {
                    const reacContainer = document.createElement('div');
                    reacContainer.className = 'msg-reactions';
                    Object.entries(msg.reactions).forEach(([emoji, users]) => {
                        const btn = document.createElement('span');
                        btn.className = 'reaction';
                        btn.innerHTML = `${emoji} <span class="r-count">${users.length}</span>`;
                        btn.addEventListener('click', () => toggleReaction(msg.id, emoji));
                        reacContainer.appendChild(btn);
                    });
                    body.appendChild(reacContainer);
                }

                content.appendChild(meta);
                content.appendChild(body);

                // Actions
                const actions = document.createElement('div');
                actions.className = 'msg-actions';

                // Reply (simplified: just mention)
                const replyBtn = document.createElement('button');
                replyBtn.className = 'act-btn';
                replyBtn.innerHTML = '<i class="fas fa-reply"></i>';
                replyBtn.title = 'Responder';
                replyBtn.addEventListener('click', () => {
                    msgInput.value = `@${msg.userName} `;
                    msgInput.focus();
                });
                actions.appendChild(replyBtn);

                // React (emoji picker quick)
                const reactBtn = document.createElement('button');
                reactBtn.className = 'act-btn';
                reactBtn.innerHTML = '<i class="far fa-smile"></i>';
                reactBtn.title = 'Reagir';
                reactBtn.addEventListener('click', () => {
                    const emojis = ['❤️', '😂', '😮', '😢', '🙏', '👍', '👎', '🔥'];
                    const picker = document.createElement('div');
                    picker.style.cssText =
                        'position:absolute;background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:6px;display:flex;gap:4px;z-index:30;flex-wrap:wrap;max-width:200px;';
                    emojis.forEach(e => {
                        const b = document.createElement('button');
                        b.textContent = e;
                        b.style.cssText =
                            'background:transparent;border:none;font-size:1.2rem;cursor:pointer;padding:2px 4px;border-radius:4px;';
                        b.addEventListener('click', () => {
                            toggleReaction(msg.id, e);
                            picker.remove();
                        });
                        picker.appendChild(b);
                    });
                    const rect = reactBtn.getBoundingClientRect();
                    picker.style.position = 'fixed';
                    picker.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';
                    picker.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
                    document.body.appendChild(picker);
                    setTimeout(() => {
                        document.addEventListener('click', function handler(e) {
                            if (!picker.contains(e.target) && e.target !== reactBtn) {
                                picker.remove();
                                document.removeEventListener('click', handler);
                            }
                        });
                    }, 10);
                });
                actions.appendChild(reactBtn);

                // Edit (only own)
                if (isOwn) {
                    const editBtn = document.createElement('button');
                    editBtn.className = 'act-btn';
                    editBtn.innerHTML = '<i class="fas fa-edit"></i>';
                    editBtn.title = 'Editar';
                    editBtn.addEventListener('click', () => {
                        const newText = prompt('Editar mensagem:', msg.text || '');
                        if (newText !== null && newText.trim() !== '') {
                            editMessage(msg.id, newText.trim());
                        } else if (newText !== null && newText.trim() === '') {
                            // Se estiver vazio, remove
                            deleteMessage(msg.id);
                        }
                    });
                    actions.appendChild(editBtn);
                }

                // Delete (own or admin)
                if (isOwn || STATE.isAdmin) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'act-btn danger';
                    delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                    delBtn.title = 'Excluir';
                    delBtn.addEventListener('click', () => {
                        if (confirm('Tem certeza que deseja excluir esta mensagem?')) {
                            deleteMessage(msg.id);
                        }
                    });
                    actions.appendChild(delBtn);
                }

                content.appendChild(actions);

                wrapper.appendChild(avatar);
                wrapper.appendChild(content);

                return wrapper;
            }

            // ----- SEND MESSAGE -----
            function sendMessage(text, imageFile = null, fileData = null) {
                const user = STATE.currentUser;
                if (!user) return;
                const textClean = text?.trim() || '';
                if (!textClean && !imageFile && !fileData) return;

                const msgData = {
                    userId: user.id,
                    userName: user.nome,
                    userAvatar: user.avatar || user.nome.charAt(0),
                    userCargo: user.cargo,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    text: textClean || '',
                    reactions: {},
                };

                // Upload image if any
                if (imageFile) {
                    const ref = storage.ref(`images/${Date.now()}_${imageFile.name}`);
                    ref.put(imageFile).then((snap) => {
                        snap.ref.getDownloadURL().then((url) => {
                            msgData.imageUrl = url;
                            db.collection('messages').add(msgData);
                        });
                    }).catch(console.error);
                    return;
                }

                // Upload file if any
                if (fileData) {
                    const ref = storage.ref(`files/${Date.now()}_${fileData.name}`);
                    ref.put(fileData).then((snap) => {
                        snap.ref.getDownloadURL().then((url) => {
                            msgData.fileUrl = url;
                            msgData.fileName = fileData.name;
                            db.collection('messages').add(msgData);
                        });
                    }).catch(console.error);
                    return;
                }

                // Text only
                db.collection('messages').add(msgData);
            }

            // ----- DELETE MESSAGE -----
            function deleteMessage(msgId) {
                const user = STATE.currentUser;
                if (!user) return;
                db.collection('messages').doc(msgId).get().then((doc) => {
                    if (!doc.exists) return;
                    const data = doc.data();
                    if (data.userId === user.id || STATE.isAdmin) {
                        db.collection('messages').doc(msgId).delete();
                    } else {
                        alert('Você não tem permissão para excluir esta mensagem.');
                    }
                }).catch(console.error);
            }

            // ----- EDIT MESSAGE -----
            function editMessage(msgId, newText) {
                const user = STATE.currentUser;
                if (!user) return;
                db.collection('messages').doc(msgId).get().then((doc) => {
                    if (!doc.exists) return;
                    const data = doc.data();
                    if (data.userId === user.id) {
                        db.collection('messages').doc(msgId).update({
                            text: newText,
                            edited: true,
                            editedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } else {
                        alert('Você só pode editar suas próprias mensagens.');
                    }
                }).catch(console.error);
            }

            // ----- TOGGLE REACTION -----
            function toggleReaction(msgId, emoji) {
                const user = STATE.currentUser;
                if (!user) return;
                const msgRef = db.collection('messages').doc(msgId);
                msgRef.get().then((doc) => {
                    if (!doc.exists) return;
                    const data = doc.data();
                    const reactions = data.reactions || {};
                    if (!reactions[emoji]) reactions[emoji] = [];
                    const idx = reactions[emoji].indexOf(user.id);
                    if (idx > -1) {
                        reactions[emoji].splice(idx, 1);
                        if (reactions[emoji].length === 0) delete reactions[emoji];
                    } else {
                        reactions[emoji].push(user.id);
                    }
                    msgRef.update({ reactions });
                }).catch(console.error);
            }

            // ----- TYPING INDICATOR (Realtime DB) -----
            function setupTyping() {
                const user = STATE.currentUser;
                if (!user) return;
                const typingRef = rtdb.ref(`typing/${user.id}`);

                msgInput.addEventListener('input', () => {
                    if (msgInput.value.trim().length > 0) {
                        if (!isTyping) {
                            isTyping = true;
                            typingRef.set({
                                userId: user.id,
                                userName: user.nome,
                                timestamp: Date.now()
                            });
                        }
                        clearTimeout(typingTimeout);
                        typingTimeout = setTimeout(() => {
                            isTyping = false;
                            typingRef.remove();
                        }, 2000);
                    } else {
                        isTyping = false;
                        typingRef.remove();
                    }
                });

                // Listen to other users typing
                rtdb.ref('typing').on('value', (snap) => {
                    const data = snap.val() || {};
                    const typingUsers = Object.values(data).filter(t => t.userId !== user.id);
                    const typingEl = document.getElementById('typingIndicator');
                    if (typingUsers.length > 0) {
                        const names = typingUsers.map(t => t.userName).join(', ');
                        typingEl.querySelector('span:first-child').textContent = `${names} está${typingUsers.length > 1 ? 'ão' : ''} digitando...`;
                        typingEl.style.display = 'flex';
                        // scroll to bottom to show typing
                        scrollToBottom();
                    } else {
                        typingEl.style.display = 'none';
                    }
                });
            }

            // ----- PRESENCE (online/offline) -----
            function setupPresence() {
                const user = STATE.currentUser;
                if (!user) return;

                // Listen to all users presence
                rtdb.ref('presence').on('value', (snap) => {
                    const data = snap.val() || {};
                    const onlineUsers = {};
                    Object.entries(data).forEach(([uid, info]) => {
                        if (info.online) {
                            onlineUsers[uid] = info;
                        }
                    });
                    STATE.onlineUsers = onlineUsers;
                    renderSidebar(onlineUsers);
                    updateStatusDot();
                });
            }

            // ----- RENDER SIDEBAR -----
            function renderSidebar(onlineUsers) {
                const container = sidebarUsers;
                container.innerHTML = '';

                // Show all users from USERS_DATA, mark online
                USERS_DATA.users.forEach(u => {
                    const isOnline = onlineUsers[u.id] && onlineUsers[u.id].online;
                    const item = document.createElement('div');
                    item.className = 'sidebar-user-item';
                    item.innerHTML = `
                <div class="s-avatar">
                  ${u.avatar || u.nome.charAt(0)}
                  <span class="s-dot ${isOnline ? 'online' : 'offline'}"></span>
                </div>
                <div class="s-info">
                  <div class="s-name">${u.nome}</div>
                  <div class="s-status">${isOnline ? 'Online' : 'Offline'}</div>
                </div>
                ${u.cargo === 'Administrador' ? '<span class="s-role-badge">Admin</span>' : ''}
              `;
                    container.appendChild(item);
                });
            }

            // ----- UPDATE STATUS DOT -----
            function updateStatusDot() {
                const dot = document.getElementById('statusDot');
                if (!dot) return;
                const user = STATE.currentUser;
                if (!user) return;
                const isOnline = STATE.onlineUsers[user.id] && STATE.onlineUsers[user.id].online;
                dot.className = `status-dot ${isOnline ? 'online' : 'offline'}`;
            }

            // ----- SCROLL TO BOTTOM -----
            function scrollToBottom() {
                setTimeout(() => {
                    messagesScroll.scrollTop = messagesScroll.scrollHeight;
                }, 50);
            }

            // ----- FORMAT TIME -----
            function formatTime(date) {
                if (!date) return 'agora';
                const d = date instanceof Date ? date : new Date(date);
                if (isNaN(d)) return 'agora';
                return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            }

            // ----- UPDATE LOG COUNT -----
            function updateLogCount(count) {
                if (logMsgCount) logMsgCount.textContent = count;
            }

            // ----- SETUP EMOJI PICKER -----
            function setupEmojiPicker() {
                const emojis = ['😀', '😂', '😍', '🥰', '😎', '🤔', '😢', '🙏', '❤️', '🔥', '⭐', '👍', '👎', '👏', '🎉', '💀',
                    '🤡', '👀', '💯', '✨', '🌈', '💪', '🫶', '🤝'
                ];
                const container = emojiPicker;
                container.innerHTML = '';
                emojis.forEach(e => {
                    const btn = document.createElement('button');
                    btn.className = 'emoji-btn';
                    btn.textContent = e;
                    btn.addEventListener('click', () => {
                        msgInput.value += e;
                        msgInput.focus();
                        container.classList.remove('open');
                    });
                    container.appendChild(btn);
                });

                emojiBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    container.classList.toggle('open');
                });

                document.addEventListener('click', (e) => {
                    if (!container.contains(e.target) && e.target !== emojiBtn) {
                        container.classList.remove('open');
                    }
                });
            }

            // ----- SETUP SETTINGS -----
            function setupSettings() {
                // Theme toggle
                themeToggle.addEventListener('click', () => {
                    STATE.isDark = !STATE.isDark;
                    themeToggle.classList.toggle('active', STATE.isDark);
                    document.documentElement.style.setProperty('--bg-primary', STATE.isDark ? '#0f0f10' : '#f4f4f6');
                    document.documentElement.style.setProperty('--bg-card', STATE.isDark ? '#18181b' : '#ffffff');
                    document.documentElement.style.setProperty('--bg-input', STATE.isDark ? '#27272a' : '#e8e8ec');
                    document.documentElement.style.setProperty('--bg-hover', STATE.isDark ? '#2a2a2e' : '#d4d4d8');
                    document.documentElement.style.setProperty('--text-primary', STATE.isDark ? '#ffffff' : '#18181b');
                    document.documentElement.style.setProperty('--text-secondary', STATE.isDark ? '#a1a1aa' : '#52525b');
                    document.documentElement.style.setProperty('--text-muted', STATE.isDark ? '#6b6b77' : '#8a8a93');
                    document.documentElement.style.setProperty('--border-color', STATE.isDark ? '#2a2a2e' : '#d4d4d8');
                });

                // Sound toggle
                soundToggle.addEventListener('click', () => {
                    STATE.soundEnabled = !STATE.soundEnabled;
                    soundToggle.classList.toggle('active', STATE.soundEnabled);
                });

                // Notifications toggle
                notifToggle.addEventListener('click', () => {
                    STATE.notificationsEnabled = !STATE.notificationsEnabled;
                    notifToggle.classList.toggle('active', STATE.notificationsEnabled);
                    if (STATE.notificationsEnabled && Notification.permission === 'default') {
                        Notification.requestPermission();
                    }
                });

                // Open/close settings
                settingsBtn.addEventListener('click', () => {
                    settingsOverlay.classList.toggle('open');
                });
                settingsClose.addEventListener('click', () => settingsOverlay.classList.remove('open'));
                settingsCloseBtn.addEventListener('click', () => settingsOverlay.classList.remove('open'));
                settingsOverlay.addEventListener('click', (e) => {
                    if (e.target === settingsOverlay) settingsOverlay.classList.remove('open');
                });
            }

            // ----- SETUP ADMIN -----
            function setupAdmin() {
                if (!STATE.isAdmin) return;

                function loadAdminUsers() {
                    const container = adminUserList;
                    container.innerHTML = '';
                    USERS_DATA.users.forEach(u => {
                        const row = document.createElement('div');
                        row.className = 'admin-user-row';
                        row.innerHTML = `
                  <div class="au-info">
                    <div class="au-avatar">${u.avatar || u.nome.charAt(0)}</div>
                    <div>
                      <div class="au-name">${u.nome}</div>
                      <div class="au-role">${u.cargo}</div>
                    </div>
                  </div>
                  <div class="au-actions">
                    ${u.id !== STATE.currentUser.id ? `
                      <button class="danger" data-action="ban" data-id="${u.id}" title="Banir"><i class="fas fa-ban"></i></button>
                      <button data-action="mute" data-id="${u.id}" title="Silenciar"><i class="fas fa-volume-mute"></i></button>
                    ` : ''}
                  </div>
                `;
                        container.appendChild(row);
                    });

                    // Action handlers
                    container.querySelectorAll('[data-action="ban"]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = btn.dataset.id;
                            if (confirm(`Tem certeza que deseja banir ${id}?`)) {
                                // Remove user from presence
                                rtdb.ref(`presence/${id}`).remove();
                                alert(`Usuário ${id} foi banido.`);
                            }
                        });
                    });

                    container.querySelectorAll('[data-action="mute"]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = btn.dataset.id;
                            if (confirm(`Silenciar ${id}?`)) {
                                alert(`Usuário ${id} silenciado.`);
                            }
                        });
                    });
                }

                adminBtn.addEventListener('click', () => {
                    adminOverlay.classList.add('open');
                    loadAdminUsers();
                });

                adminClose.addEventListener('click', () => adminOverlay.classList.remove('open'));
                adminOverlay.addEventListener('click', (e) => {
                    if (e.target === adminOverlay) adminOverlay.classList.remove('open');
                });

                adminRefreshBtn.addEventListener('click', loadAdminUsers);
            }

            // ----- SEARCH -----
            function setupSearch() {
                searchBtn.addEventListener('click', () => {
                    const term = prompt('Pesquisar mensagens:', '');
                    if (term === null || term.trim() === '') return;
                    const results = allMessages.filter(m =>
                        m.text?.toLowerCase().includes(term.toLowerCase())
                    );
                    if (results.length === 0) {
                        alert('Nenhuma mensagem encontrada.');
                        return;
                    }
                    // Highlight first result
                    const first = results[0];
                    const bubbles = messagesScroll.querySelectorAll('.msg-bubble');
                    bubbles.forEach(el => {
                        el.style.border = 'none';
                        if (el.dataset.msgId === first.id) {
                            el.style.border = '2px solid var(--primary)';
                            el.style.borderRadius = 'var(--radius-sm)';
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    });
                    alert(`${results.length} mensagem(ns) encontrada(s).`);
                });
            }

            // ----- LOGOUT -----
            function setupLogout() {
                logoutBtn.addEventListener('click', () => {
                    const user = STATE.currentUser;
                    if (user) {
                        rtdb.ref(`presence/${user.id}`).set({
                            online: false,
                            nome: user.nome,
                            lastSeen: Date.now()
                        });
                        db.collection('users').doc(user.id).update({
                            online: false,
                            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    auth.signOut().then(() => {
                        STATE.currentUser = null;
                        STATE.isAdmin = false;
                        render('login');
                    }).catch(console.error);
                });
            }

            // ----- TOGGLE SIDEBAR -----
            function setupSidebarToggle() {
                toggleSidebarBtn.addEventListener('click', () => {
                    STATE.sidebarOpen = !STATE.sidebarOpen;
                    sidebar.classList.toggle('collapsed', !STATE.sidebarOpen);
                    sidebar.classList.toggle('open', STATE.sidebarOpen);
                });
                // On mobile, close sidebar by default
                if (window.innerWidth <= 768) {
                    STATE.sidebarOpen = false;
                    sidebar.classList.add('collapsed');
                }
                window.addEventListener('resize', () => {
                    if (window.innerWidth > 768 && !STATE.sidebarOpen) {
                        STATE.sidebarOpen = true;
                        sidebar.classList.remove('collapsed');
                        sidebar.classList.add('open');
                    }
                    if (window.innerWidth <= 768 && STATE.sidebarOpen) {
                        STATE.sidebarOpen = false;
                        sidebar.classList.add('collapsed');
                        sidebar.classList.remove('open');
                    }
                });
            }

            // ----- SEND LOGIC -----
            function handleSend() {
                const text = msgInput.value;
                sendMessage(text);
                msgInput.value = '';
                msgInput.style.height = 'auto';
                msgInput.focus();
                // Remove typing
                const user = STATE.currentUser;
                if (user) {
                    rtdb.ref(`typing/${user.id}`).remove();
                    isTyping = false;
                }
            }

            // ----- IMAGE & FILE UPLOAD -----
            function setupUploads() {
                imageBtn.addEventListener('click', () => imageInput.click());
                fileBtn.addEventListener('click', () => fileInput.click());

                imageInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        sendMessage('', file);
                    }
                    imageInput.value = '';
                });

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        sendMessage('', null, file);
                    }
                    fileInput.value = '';
                });
            }

            // ----- AUTO-RESIZE TEXTAREA -----
            function setupAutoResize() {
                msgInput.addEventListener('input', () => {
                    msgInput.style.height = 'auto';
                    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
                });
            }

            // ----- NOTIFICATIONS -----
            function setupNotifications() {
                // Listen for new messages via snapshot
                const unsub = db.collection('messages')
                    .orderBy('timestamp', 'desc')
                    .limit(1)
                    .onSnapshot((snap) => {
                        snap.docChanges().forEach((change) => {
                            if (change.type === 'added') {
                                const data = change.doc.data();
                                if (data.userId !== STATE.currentUser.id) {
                                    // Sound
                                    if (STATE.soundEnabled) {
                                        try {
                                            const ctx = new(window.AudioContext || window.webkitAudioContext)();
                                            const osc = ctx.createOscillator();
                                            const gain = ctx.createGain();
                                            osc.connect(gain);
                                            gain.connect(ctx.destination);
                                            osc.frequency.value = 800;
                                            osc.type = 'sine';
                                            gain.gain.setValueAtTime(0.1, ctx.currentTime);
                                            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                                            osc.start(ctx.currentTime);
                                            osc.stop(ctx.currentTime + 0.15);
                                        } catch (_) { /* no sound */ }
                                    }
                                    // Notification
                                    if (STATE.notificationsEnabled && Notification.permission === 'granted') {
                                        new Notification(`ViquinhoChat — ${data.userName || 'Alguém'}`, {
                                            body: data.text || 'Enviou uma mensagem',
                                            icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="50" fill="%23ff7a00"/%3E%3Ctext x="50" y="68" text-anchor="middle" font-size="48" fill="white" font-family="sans-serif"%3E💬%3C/text%3E%3C/svg%3E'
                                        });
                                    }
                                }
                            }
                        });
                    });
                messageListeners.push(unsub);

                if (Notification.permission === 'default') {
                    Notification.requestPermission();
                }
            }

            // ----- INIT CHAT -----
            loadMessages();
            setupTyping();
            setupPresence();
            setupEmojiPicker();
            setupSettings();
            setupAdmin();
            setupSearch();
            setupLogout();
            setupSidebarToggle();
            setupUploads();
            setupAutoResize();
            setupNotifications();

            // Send events
            sendBtn.addEventListener('click', handleSend);
            msgInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            // Focus input
            setTimeout(() => msgInput.focus(), 300);
        }

        // ================================================================
        // 6. BOOT
        // ================================================================

        // Verifica se já está autenticado
        auth.onAuthStateChanged((user) => {
            if (user && STATE.currentUser) {
                // Já logado, mantém no chat
                if (document.querySelector('.chat-container')) {
                    // já está no chat
                } else {
                    render('chat');
                }
            } else {
                render('login');
            }
        });

        // Inicializa
        render('login');

        console.log('🚀 ViquinhoChat iniciado!');
        console.log('🔑 Senha do sistema: toletão');
    </script>
</body>
</html>
